[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17.2",
  "asyncpg>=0.30.0",
  "cuid2>=2.0.1",
  "fastapi[standard]>=0.128.0",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "sqlalchemy[asyncio]>=2.0.44",
  "paramiko>=4.0.0",
  "fastapi-oauth2>=1.5.1",
  "social-auth-core>=7.2.0",
]

[dependency-groups]
dev = [
    "faker>=40.4.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.5.0",
]

[tool.pyright]
venvPath = ".devenv/state"
venv = "venv"
include = ["**/*.py"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.13"

[tool.ruff]
indent-width = 4
line-length = 80

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
extend-select = ["E501"]
select = ["E", "F", "UP", "B", "SIM", "I", "S", "FAST"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["dr_ctf", "tests"]
